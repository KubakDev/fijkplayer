group 'com.befovy.fijkplayer'
version '0.11.0'

apply plugin: 'com.android.library'

android {
    compileSdkVersion 30

    defaultConfig {
        minSdkVersion 16
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    // Local AAR: upstream fijkplayer-full:0.7.16 with x86_64 .so replaced by
    // 16 KB page-aligned builds (from GSYVideoPlayer gsyvideoplayer-x64).
    // Use files() so Flutter app builds resolve the AAR without flatDir.
    implementation files('libs/fijkplayer-full-release.aar')
    implementation 'androidx.annotation:annotation:1.2.0'
}
